<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Gapera Alpha 3</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0" rel="stylesheet" />
  <style>
:root{--f:"Google Sans","Roboto",system-ui,sans-serif;--sh-xs:4px;--sh-s:8px;--sh-m:12px;--sh-l:16px;--sh-xl:28px;--sh-full:9999px;--ease:cubic-bezier(.2,0,0,1)}
:root{color-scheme:dark;--p:#D0BCFF;--on-p:#381E72;--p-c:#4F378B;--on-p-c:#EADDFF;--s2-c:#4A4458;--on-s2:#E8DEF8;--e:#F2B8B5;--on-e:#601410;--bg:#1C1B1F;--on:#E6E1E5;--sv:#49454F;--on-sv:#CAC4D0;--ol:#938F99;--ol-v:#49454F;--sc:#211F26;--sc-h:#2B2930;--sc-hi:#36343B;--win:#81C784;--on-win:#1B5E20}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--f);background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 78%,transparent),color-mix(in srgb,var(--bg) 92%,transparent)),url('https://s.fotora.ru/b4a6c30bcffdad8d.jpeg') center/cover fixed no-repeat;color:var(--on);min-height:100vh;min-height:100dvh;padding-bottom:calc(80px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.mat{font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;vertical-align:middle;font-style:normal;font-size:24px;line-height:1}

/* Topbar */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--ol-v);padding:.6rem 1rem;display:flex;align-items:center;gap:.6rem;max-width:560px;margin:0 auto}
.topbar-left{flex:1;display:flex;align-items:baseline;gap:.4rem}
.topbar-name{font-size:1.2rem;font-weight:700}
.topbar-beta{font-size:.55rem;font-weight:600;letter-spacing:.6px;background:var(--p-c);color:var(--on-p-c);padding:.12rem .45rem;border-radius:var(--sh-xs);text-transform:uppercase}
.bal{display:flex;align-items:center;gap:.3rem;background:var(--s2-c);color:var(--on-s2);border-radius:var(--sh-full);padding:.45rem .9rem;font-weight:700;font-size:.95rem;transition:transform .15s var(--ease)}
.bal.bump{transform:scale(1.08)}
.bal .mat{font-size:20px;color:#FFC107;font-variation-settings:'FILL' 1}
.bonus{font-size:.55rem;font-weight:400;opacity:.65;margin-left:.15rem}

main{max-width:560px;margin:0 auto;padding:.8rem 1rem}
.scr{display:none}.scr.on{display:block;animation:fi .32s var(--ease)}
@keyframes fi{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

.card{background:color-mix(in srgb,var(--sc-h) 88%,transparent);backdrop-filter:blur(6px);border-radius:var(--sh-xl);padding:1.2rem;margin-bottom:.8rem;border:1px solid var(--ol-v);transition:transform .2s var(--ease)}
.lbl{font-size:.6875rem;font-weight:500;letter-spacing:.5px;color:var(--on-sv);margin-bottom:.4rem}

/* Buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:var(--sh-full);padding:.7rem 1.4rem;font-size:.875rem;font-weight:500;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:transform .12s var(--ease), background-color .15s, opacity .15s, box-shadow .2s}
.btn:active{transform:scale(.95)}
.btn::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s;pointer-events:none}
.btn:hover::after{opacity:.08}.btn:active::after{opacity:.12}
.btn .mat{font-size:20px;line-height:1}
.btn:disabled{opacity:.45;cursor:default}.btn:disabled::after{display:none}
.btn-p{background:var(--p);color:var(--on-p)}.btn-s{background:var(--s2-c);color:var(--on-s2)}
.btn-o{background:transparent;color:var(--p);border-color:var(--ol)}.btn-w{background:var(--win);color:var(--on-win)}
.btn-lg{width:100%;padding:1rem;font-size:1rem}.btn-sm{padding:.5rem .9rem;font-size:.8rem}

/* Bet */
.bet-row{display:flex;align-items:center;gap:.5rem;margin:.6rem 0}
.bet-row input{flex:1;padding:.6rem .7rem;border:1.5px solid var(--ol-v);border-radius:var(--sh-s);background:var(--bg);color:var(--on);font:inherit;font-size:.95rem;text-align:center;outline:none;transition:border-color .2s}
.bet-row input:focus{border-color:var(--p)}
.bet-q{padding:.3rem .6rem;border-radius:var(--sh-full);border:1px solid var(--ol-v);background:transparent;color:var(--on-sv);font:500 .7rem/1 var(--f);cursor:pointer;transition:background .15s, transform .1s}
.bet-q:active{transform:scale(.92)}
.bet-q:hover{background:var(--sc-hi)}
.bet-quick{display:flex;gap:.3rem;justify-content:center;margin-top:.3rem}
.bet-max{text-align:center;font-size:.7rem;color:var(--on-sv);margin-top:.4rem}

/* Slots */
.reels{display:flex;gap:.5rem;justify-content:center;padding:.8rem 0;position:relative}
.reel{width:90px;height:90px;display:grid;place-items:center;background:var(--sc-hi);border-radius:var(--sh-l);font-size:2.5rem;border:2px solid var(--ol-v);transition:border-color .3s, transform .2s var(--ease), box-shadow .3s}
.reel.win{border-color:var(--win);animation:wpop .45s var(--ease);box-shadow:0 0 18px color-mix(in srgb,var(--win) 55%,transparent)}
.reel.win2{border-color:#FFC107;animation:wpop .45s var(--ease);box-shadow:0 0 14px rgba(255,193,7,.45)}
@keyframes wpop{0%{transform:scale(1)}45%{transform:scale(1.18) rotate(-3deg)}70%{transform:scale(.96) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
.reel.roll{animation:rk .08s linear infinite;filter:blur(1.5px)}
@keyframes rk{0%{transform:translateY(-5px) rotate(-2deg)}50%{transform:translateY(3px) rotate(2deg)}100%{transform:translateY(-5px) rotate(-2deg)}}
.win-line{text-align:center;font-weight:700;min-height:1.2rem;margin:.5rem 0;font-size:.9rem;transition:transform .2s var(--ease)}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:.3rem .6rem}
.pay-grid div{display:flex;justify-content:space-between;padding:.35rem .6rem;background:var(--sc);border-radius:var(--sh-m);font-size:.8rem}

/* Dice */
.dice-area{display:flex;gap:1rem;justify-content:center;padding:1rem 0}
.die{width:80px;height:80px;display:grid;place-items:center;background:var(--sc-hi);border-radius:var(--sh-l);font-size:2.5rem;font-weight:700;border:2px solid var(--ol-v);transition:all .3s}
.die.rolling{animation:dieRoll .15s linear infinite;border-color:var(--p)}
@keyframes dieRoll{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(10deg) scale(1.08)}100%{transform:rotate(-10deg) scale(1)}}
.dice-res{text-align:center;font-weight:700;font-size:1.2rem;margin:.5rem 0;min-height:1.5rem}
.m3-slider{position:relative;display:block;width:100%;height:104px}
.m3-slider input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:10}
.m3-slider__label{position:absolute;top:0;width:48px;height:44px;background:var(--on);color:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;z-index:5;pointer-events:none;transform:translateX(-50%);transition:left .05s}
.m3-slider__label::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:-8px;border:6px solid transparent;border-top-color:var(--on)}
.m3-slider__track{position:absolute;left:0;right:0;top:40px;height:44px;z-index:1;pointer-events:none}
.m3-slider__inactive{position:absolute;left:0;right:0;top:50%;height:16px;transform:translateY(-50%);background:var(--s2-c);border-radius:8px}
.m3-slider__active{position:absolute;left:0;top:50%;height:16px;transform:translateY(-50%);background:var(--p);border-radius:8px 2px 2px 8px;transition:width .05s}
.m3-slider__handle{position:absolute;top:0;width:4px;height:44px;background:var(--p);border-radius:2px;transform:translateX(-50%);transition:left .05s,width .12s var(--ease)}
.m3-slider:active .m3-slider__handle{width:2px}
.dice-target{display:flex;justify-content:space-between;font-size:.75rem;color:var(--on-sv)}
.dice-chance{display:flex;justify-content:center;gap:1rem;margin:.6rem 0}
.ch-item{text-align:center}
.ch-item .v{font-weight:700;font-size:1.1rem}
.ch-item .l{font-size:.65rem;color:var(--on-sv)}

/* Roulette */
.rr-board{display:flex;flex-direction:column;gap:.4rem;padding:.5rem 0}
.rr-row{display:flex;gap:.3rem;justify-content:center}
.rr-b{width:48px;height:48px;border-radius:var(--sh-m);border:none;font:700 .9rem/1 var(--f);cursor:pointer;transition:transform .12s var(--ease), outline .15s;display:grid;place-items:center}
.rr-b:active{transform:scale(.90)}
.rr-r{background:#E53935;color:#fff}.rr-k{background:#212121;color:#fff}.rr-g{background:#2E7D32;color:#fff}
.rr-b.sel{outline:3px solid var(--p);outline-offset:2px}
.rr-out{display:flex;gap:.3rem;justify-content:center}
.rr-out .rr-b{width:auto;padding:.4rem .8rem;font-size:.75rem;font-weight:500}
.rr-res{text-align:center;font-weight:700;font-size:1.1rem;margin:.4rem 0;min-height:1.3rem}
.rr-num{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;font-weight:700;margin:0 auto .5rem;border:3px solid var(--ol-v);transition:all .3s var(--ease)}
.rr-num.spin{animation:rrSpin .95s cubic-bezier(.2,.6,.25,1)}
@keyframes rrSpin{0%{transform:rotate(0deg) scale(1)}55%{transform:rotate(900deg) scale(1.15)}100%{transform:rotate(1080deg) scale(1)}}

/* Mines */
.m-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;padding:.5rem 0}
.m-cell{aspect-ratio:1;display:grid;place-items:center;background:var(--sc-hi);border-radius:var(--sh-m);font-size:1.3rem;cursor:pointer;border:2px solid var(--ol-v);transition:transform .12s var(--ease), background-color .2s, border-color .2s}
.m-cell:active{transform:scale(.9)}
.m-cell.rev{background:var(--sc);border-color:var(--ol-v)}
.m-cell.gem{background:var(--p-c);border-color:var(--p);animation:popCell .25s var(--ease)}
.m-cell.bomb{background:var(--e);border-color:var(--e);color:var(--on-e);animation:shake .3s var(--ease)}
.m-cell.bomb-flash{animation:bombFlash .55s var(--ease)}
@keyframes bombFlash{0%{box-shadow:0 0 0 0 rgba(242,184,181,.9)}100%{box-shadow:0 0 0 26px rgba(242,184,181,0)}}
@keyframes popCell{0%{transform:scale(.8)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake-scr{animation:screenShake .4s var(--ease)}
@keyframes screenShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(5px,-2px)}}
.m-info{text-align:center;margin:.5rem 0;min-height:1.5rem}
.m-info .mult{font-weight:700;color:var(--p)}
.m-row{display:flex;gap:.5rem;align-items:center;justify-content:center;margin:.4rem 0;flex-wrap:wrap}
.m-cnt{display:grid;grid-template-columns:repeat(5,minmax(40px,1fr));gap:.3rem;width:100%;max-width:260px}
.m-cnt button{min-width:40px;height:36px;border-radius:var(--sh-full);border:1px solid var(--ol-v);background:transparent;color:var(--on);font:500 .85rem/1 var(--f);cursor:pointer;transition:all .15s}
.m-cnt button.on{background:var(--p);color:var(--on-p);border-color:var(--p)}
.m-particle{position:fixed;width:10px;height:10px;border-radius:50%;background:#FF7043;pointer-events:none;z-index:300;animation:mExplode .7s cubic-bezier(.12,.7,.2,1) forwards;box-shadow:0 0 10px rgba(255,112,67,.75)}
@keyframes mExplode{0%{transform:translate(0,0) scale(1.3);opacity:1}55%{opacity:1}100%{transform:translate(var(--ex),var(--ey)) scale(.05);opacity:0}}
.m-ring{position:fixed;width:18px;height:18px;border:4px solid #FFC107;border-radius:50%;pointer-events:none;z-index:299;animation:boomRing .7s ease-out forwards}
@keyframes boomRing{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(9);opacity:0}}
.m-flash{position:fixed;inset:0;background:rgba(242,184,181,.25);pointer-events:none;z-index:298;animation:flashOut .28s ease-out forwards}
@keyframes flashOut{0%{opacity:1}100%{opacity:0}}


/* Confetti */
.confetti-piece{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:300;animation:confettiFall .9s ease-out forwards}
@keyframes confettiFall{0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}100%{transform:translate(var(--cx),var(--cy)) rotate(var(--cr)) scale(.4);opacity:0}}

/* Coin */
.coin{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;font-size:2.5rem;margin:1rem auto;border:4px solid var(--ol-v);background:var(--sc-hi);transition:transform .3s var(--ease)}
.coin.flip{animation:cf .65s ease-out}
@keyframes cf{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(900deg) scale(1.2)}100%{transform:rotateY(1800deg) scale(1)}}
.coin-res{text-align:center;font-weight:700;font-size:1.1rem;margin:.5rem 0;min-height:1.3rem}
.coin-ch{display:flex;gap:.5rem;justify-content:center}
.coin-ch button{flex:1;padding:.7rem;border-radius:var(--sh-full);font:600 .9rem/1 var(--f);border:2px solid var(--ol-v);cursor:pointer;transition:all .15s}
.coin-ch button:active{transform:scale(.95)}
.coin-ch button.on{border-color:var(--p);background:var(--p-c);color:var(--on-p-c)}

/* Stats */
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:.8rem}
.stat{background:var(--sc-h);border-radius:var(--sh-l);padding:.7rem;text-align:center}
.stat .v{font-weight:700;font-size:1.2rem}.stat .l{font-size:.65rem;color:var(--on-sv)}
.hist-list{max-height:300px;overflow-y:auto}
.h-item{display:flex;justify-content:space-between;align-items:center;padding:.45rem .6rem;border-radius:var(--sh-m);margin-bottom:.2rem;font-size:.8rem}
.h-item:nth-child(odd){background:var(--sc)}
.h-item .w{color:var(--win);font-weight:700}.h-item .l{color:var(--e);font-weight:700}

/* Clicker */
.clk-wrap{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1.2rem 0}
.clk-star{border:none;background:none;cursor:pointer;width:180px;height:180px;display:grid;place-items:center;border-radius:50%;transition:transform .08s var(--ease);position:relative}
.clk-star:active{transform:scale(.88) rotate(-2deg)}
.clk-star.pop{animation:clkPop .22s var(--ease)}
@keyframes clkPop{0%{transform:scale(1)}45%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1)}}
.clk-star:disabled{opacity:.4;cursor:default}
.clk-star .mat{font-size:140px;filter:drop-shadow(0 0 12px rgba(255,193,7,0.3))}
.clk-count{font-size:.85rem;font-weight:700;color:var(--on-sv);text-align:center}
.clk-count b{color:var(--on)}
.clk-float{position:fixed;pointer-events:none;z-index:200;font-weight:700;font-size:1.4rem;color:#FFC107;animation:clkf .75s ease-out forwards}
@keyframes clkf{0%{opacity:1;transform:translate(-50%,0) scale(0.8)}50%{opacity:1;transform:translate(calc(-50% + var(--dx)),-40px) scale(1.2)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)*1.5),-80px) scale(1)}}
.clk-bar{width:100%;height:8px;border-radius:var(--sh-full);background:var(--sc);overflow:hidden;margin:.6rem 0 .3rem}
.clk-bar-fill{height:100%;background:var(--p);transition:width .3s var(--ease)}
.clk-limit{font-size:.75rem;color:var(--on-sv);text-align:center}
.up-card{display:flex;align-items:center;justify-content:space-between;gap:.6rem;background:var(--sc);border-radius:var(--sh-l);padding:.7rem .9rem;margin-bottom:.5rem;transition:transform .12s var(--ease)}
.up-card:active{transform:scale(.98)}
.up-info{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.up-name{font-size:.85rem;font-weight:600}
.up-lvl{font-size:.7rem;color:var(--on-sv)}
.up-btn{white-space:nowrap;flex-shrink:0}

/* Daily */
.daily-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.8rem}
.day-card{background:var(--sc);border-radius:var(--sh-l);padding:.6rem .3rem;text-align:center;border:2px solid transparent;transition:all .2s var(--ease)}
.day-card.done{background:var(--p-c);border-color:var(--p)}
.day-card.cur{border-color:var(--win);animation:dayPulse 1.6s ease-in-out infinite}
@keyframes dayPulse{0%,100%{box-shadow:0 0 0 0 rgba(129,199,132,.5)}50%{box-shadow:0 0 0 6px rgba(129,199,132,0)}}
.day-card .dn{font-size:.62rem;color:var(--on-sv);margin-bottom:.2rem}
.day-card .dv{font-weight:700;font-size:.8rem}
.day-card .di{font-size:1.25rem;margin-top:.1rem}
.daily-cd{text-align:center;font-size:.85rem;color:var(--on-sv);margin-top:.6rem}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;background:color-mix(in srgb,var(--sc) 78%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--ol-v);padding-bottom:env(safe-area-inset-bottom);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.ni{flex:1 1 0;min-width:52px;max-width:94px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0 .4rem;color:var(--on-sv);font-family:inherit}
.ni .mat{font-size:22px}
.np{display:grid;place-items:center;width:48px;height:28px;border-radius:var(--sh-full);transition:background .2s, transform .15s}
.ni:active .np{transform:scale(.92)}
.ni.on{color:var(--on)}.ni.on .np{background:var(--s2-c);color:var(--on-s2)}
.ni.on .mat{font-variation-settings:'FILL' 1}
.nl{font-size:.6rem;font-weight:500}

.sn{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;visibility:hidden;background:var(--on);color:var(--bg);border-radius:var(--sh-s);padding:.55rem 1rem;font-size:.85rem;transition:all .3s var(--ease);z-index:100;max-width:90vw;text-align:center;font-weight:500}
.sn.on{transform:translate(-50%,0);opacity:1;visibility:visible}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left"><span class="topbar-name">Gapera</span><span class="topbar-beta">ALPHA 3</span></div>
  <div class="bal" id="balBox"><span class="mat">star</span><span id="bal">1000</span><span class="bonus" id="btxt"></span></div>
</div>

<main>
  <!-- SLOTS -->
  <section class="scr on" id="s-slots">
    <div class="card">
      <div class="reels"><div class="reel" id="sr0">-</div><div class="reel" id="sr1">-</div><div class="reel" id="sr2">-</div></div>
      <div class="win-line" id="sW"></div>
      <div class="bet-row"><button class="btn btn-s btn-sm" id="sDn">−</button><input id="sBet" type="number" value="50" min="10" step="10" /><button class="btn btn-s btn-sm" id="sUp">+</button></div>
      <div class="bet-quick"><button class="bet-q" data-v="10">10</button><button class="bet-q" data-v="50">50</button><button class="bet-q" data-v="100">100</button><button class="bet-q" data-v="500">500</button></div>
      <div class="bet-max">Лимит ставки: <b id="sMaxV">300</b> ⭐ — растёт от побед</div>
      <button class="btn btn-p btn-lg" id="sGo" style="margin-top:.8rem"><span class="mat">casino</span> SPIN</button>
    </div>
    <div class="card">
      <div class="lbl">ВЫПЛАТА ЗА 3 В РЯД</div>
