<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Gapera</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0" rel="stylesheet" />
  <style>
:root{--f:"Google Sans","Roboto",system-ui,sans-serif;--sh-xs:4px;--sh-s:8px;--sh-m:12px;--sh-l:16px;--sh-xl:28px;--sh-full:9999px;--ease:cubic-bezier(.2,0,0,1)}
:root{color-scheme:dark;--p:#D0BCFF;--on-p:#381E72;--p-c:#4F378B;--on-p-c:#EADDFF;--s2-c:#4A4458;--on-s2:#E8DEF8;--e:#F2B8B5;--on-e:#601410;--bg:#1C1B1F;--on:#E6E1E5;--sv:#49454F;--on-sv:#CAC4D0;--ol:#938F99;--ol-v:#49454F;--sc:#211F26;--sc-h:#2B2930;--sc-hi:#36343B;--win:#81C784;--on-win:#1B5E20}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--f);background:linear-gradient(color-mix(in srgb,var(--bg) 62%,transparent),color-mix(in srgb,var(--bg) 62%,transparent)),url('https://s.fotora.ru/2b1d0a7737fc7cd9.jpeg') center/cover no-repeat fixed,var(--bg);color:var(--on);min-height:100vh;min-height:100dvh;padding-bottom:calc(80px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.mat{font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;vertical-align:middle;font-style:normal;font-size:24px;line-height:1}

/* Topbar */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--ol-v);padding:.6rem 1rem;display:flex;align-items:center;gap:.6rem;max-width:560px;margin:0 auto}
.topbar-left{flex:1;display:flex;align-items:baseline;gap:.4rem}
.topbar-name{font-size:1.2rem;font-weight:700}
.topbar-beta{font-size:.55rem;font-weight:600;letter-spacing:.6px;background:var(--p-c);color:var(--on-p-c);padding:.12rem .45rem;border-radius:var(--sh-xs);text-transform:uppercase}
.bal{display:flex;align-items:center;gap:.3rem;background:var(--s2-c);color:var(--on-s2);border-radius:var(--sh-full);padding:.45rem .9rem;font-weight:700;font-size:.95rem}
.bal .mat{font-size:20px;color:#FFC107;font-variation-settings:'FILL' 1}
.uid{margin-left:auto;font-size:.6rem;color:var(--ol-v);font-weight:600;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:help}
.bonus{font-size:.55rem;font-weight:400;opacity:.65;margin-left:.15rem}
.ib{width:36px;height:36px;border-radius:var(--sh-full);border:none;display:grid;place-items:center;cursor:pointer;background:transparent;color:var(--on-sv)}
.ib:hover{background:color-mix(in srgb,var(--on) 8%,transparent)}

main{max-width:560px;margin:0 auto;padding:.8rem 1rem}
.scr{display:none}.scr.on{display:block;animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}}

.card{background:var(--sc-h);border-radius:var(--sh-xl);padding:1.2rem;margin-bottom:.8rem;border:1px solid var(--ol-v)}
.lbl{font-size:.6875rem;font-weight:500;letter-spacing:.5px;color:var(--on-sv);margin-bottom:.4rem}

/* Buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:var(--sh-full);padding:.7rem 1.4rem;font-size:.875rem;font-weight:500;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:all .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .2s;pointer-events:none}
.btn:hover::after{opacity:.08}.btn:active::after{opacity:.1}
.btn .mat{font-size:20px;line-height:1}
.btn:disabled{opacity:.45;cursor:default}.btn:disabled::after{display:none}
.btn-p{background:var(--p);color:var(--on-p)}.btn-s{background:var(--s2-c);color:var(--on-s2)}
.btn-o{background:transparent;color:var(--p);border-color:var(--ol)}.btn-t{background:transparent;color:var(--p)}
.btn-w{background:var(--win);color:var(--on-win)}
.btn-lg{width:100%;padding:1rem;font-size:1rem}.btn-sm{padding:.5rem .9rem;font-size:.8rem}

/* Bet */
.bet-row{display:flex;align-items:center;gap:.5rem;margin:.6rem 0}
.bet-row input{flex:1;padding:.6rem .7rem;border:1.5px solid var(--ol-v);border-radius:var(--sh-s);background:var(--bg);color:var(--on);font:inherit;font-size:.95rem;text-align:center;outline:none}
.bet-row input:focus{border-color:var(--p);border-width:2px;padding:calc(.6rem - 1px) calc(.7rem - 1px)}
.bet-q{padding:.3rem .6rem;border-radius:var(--sh-full);border:1px solid var(--ol-v);background:transparent;color:var(--on-sv);font:500 .7rem/1 var(--font);cursor:pointer}
.bet-q:hover{background:var(--sc-hi)}
.bet-quick{display:flex;gap:.3rem;justify-content:center;margin-top:.3rem}

/* Slots */
.reels{display:flex;gap:.5rem;justify-content:center;padding:.8rem 0}
.reel{width:90px;height:90px;display:grid;place-items:center;background:var(--sc-hi);border-radius:var(--sh-l);font-size:2.5rem;border:2px solid var(--ol-v);transition:border-color .3s}
.reel.win{border-color:var(--win);animation:wpop .35s var(--ease)}
@keyframes wpop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
.reel.roll{animation:rk .1s linear infinite}
@keyframes rk{0%{transform:translateY(-3px)}100%{transform:translateY(3px)}}
.win-line{text-align:center;font-weight:700;min-height:1.2rem;margin:.5rem 0;font-size:.9rem}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:.3rem .6rem}
.pay-grid div{display:flex;justify-content:space-between;padding:.35rem .6rem;background:var(--sc);border-radius:var(--sh-m);font-size:.8rem}

/* Dice */
.dice-area{display:flex;gap:1rem;justify-content:center;padding:1rem 0}
.die{width:80px;height:80px;display:grid;place-items:center;background:var(--sc-hi);border-radius:var(--sh-l);font-size:2.5rem;font-weight:700;border:2px solid var(--ol-v);transition:all .3s}
.dice-res{text-align:center;font-weight:700;font-size:1.2rem;margin:.5rem 0;min-height:1.5rem}
/* M3 Expressive Slider — XS standard, variant 3 */
.m3-slider{position:relative;display:block;width:100%;height:104px}
.m3-slider input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:10}
.m3-slider__label{position:absolute;top:0;width:48px;height:44px;background:var(--on);color:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;z-index:5;pointer-events:none;transform:translateX(-50%);transition:left .05s}
.m3-slider__label::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:-8px;border:6px solid transparent;border-top-color:var(--on)}
.m3-slider__track{position:absolute;left:0;right:0;top:40px;height:44px;z-index:1;pointer-events:none}
.m3-slider__inactive{position:absolute;left:0;right:0;top:50%;height:16px;transform:translateY(-50%);background:var(--s2-c);border-radius:8px}
.m3-slider__active{position:absolute;left:0;top:50%;height:16px;transform:translateY(-50%);background:var(--p);border-radius:8px 2px 2px 8px;transition:width .05s}
.m3-slider__handle{position:absolute;top:0;width:4px;height:44px;background:var(--p);border-radius:2px;transform:translateX(-50%);transition:left .05s,width .12s var(--ease)}
.m3-slider:active .m3-slider__handle{width:2px}
.dice-target{display:flex;justify-content:space-between;font-size:.75rem;color:var(--on-sv)}
.dice-chance{display:flex;justify-content:center;gap:1rem;margin:.6rem 0}
.ch-item{text-align:center}
.ch-item .v{font-weight:700;font-size:1.1rem}
.ch-item .l{font-size:.65rem;color:var(--on-sv)}

/* Roulette */
.rr-board{display:flex;flex-direction:column;gap:.4rem;padding:.5rem 0}
.rr-row{display:flex;gap:.3rem;justify-content:center}
.rr-b{width:48px;height:48px;border-radius:var(--sh-m);border:none;font:700 .9rem/1 var(--f);cursor:pointer;transition:all .15s;display:grid;place-items:center}
.rr-b:active{transform:scale(.92)}
.rr-r{background:#E53935;color:#fff}.rr-k{background:#212121;color:#fff}.rr-g{background:#2E7D32;color:#fff}
.rr-b.sel{outline:3px solid var(--p);outline-offset:2px}
.rr-out{display:flex;gap:.3rem;justify-content:center}
.rr-out .rr-b{width:auto;padding:.4rem .8rem;font-size:.75rem;font-weight:500}
.rr-res{text-align:center;font-weight:700;font-size:1.1rem;margin:.4rem 0;min-height:1.3rem}
.rr-num{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;font-weight:700;margin:0 auto .5rem;border:3px solid var(--ol-v);transition:all .3s}

/* Mines */
.m-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;padding:.5rem 0}
.m-cell{aspect-ratio:1;display:grid;place-items:center;background:var(--sc-hi);border-radius:var(--sh-m);font-size:1.3rem;cursor:pointer;border:2px solid var(--ol-v);transition:all .2s}
.m-cell:active{transform:scale(.93)}
.m-cell.rev{background:var(--sc);border-color:var(--ol-v)}
.m-cell.gem{background:var(--p-c);border-color:var(--p)}
.m-cell.bomb{background:var(--e);border-color:var(--e);color:var(--on-e)}
.m-info{text-align:center;margin:.5rem 0;min-height:1.5rem}
.m-info .mult{font-weight:700;color:var(--p)}
.m-row{display:flex;gap:.5rem;align-items:center;justify-content:center;margin:.4rem 0;flex-wrap:wrap}
.m-cnt{display:grid;grid-template-columns:repeat(5,minmax(40px,1fr));gap:.3rem;width:100%;max-width:260px}
.m-cnt button{min-width:40px;height:36px;border-radius:var(--sh-full);border:1px solid var(--ol-v);background:transparent;color:var(--on);font:500 .85rem/1 var(--f);cursor:pointer}
.m-cnt button.on{background:var(--p);color:var(--on-p);border-color:var(--p)}

/* Coin */
.coin{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;font-size:2.5rem;margin:1rem auto;border:4px solid var(--ol-v);background:var(--sc-hi);transition:all .3s}
.coin.flip{animation:cf .6s ease}
@keyframes cf{0%{transform:rotateY(0)}50%{transform:rotateY(900deg)}100%{transform:rotateY(1800deg)}}
.coin-res{text-align:center;font-weight:700;font-size:1.1rem;margin:.5rem 0;min-height:1.3rem}
.coin-ch{display:flex;gap:.5rem;justify-content:center}
.coin-ch button{flex:1;padding:.7rem;border-radius:var(--sh-full);font:600 .9rem/1 var(--f);border:2px solid var(--ol-v);cursor:pointer;transition:all .15s}
.coin-ch button:active{transform:scale(.95)}
.coin-ch button.on{border-color:var(--p);background:var(--p-c);color:var(--on-p-c)}

/* Stats */
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:.8rem}
.stat{background:var(--sc-h);border-radius:var(--sh-l);padding:.7rem;text-align:center}
.stat .v{font-weight:700;font-size:1.2rem}.stat .l{font-size:.65rem;color:var(--on-sv)}
.hist-list{max-height:300px;overflow-y:auto}
.h-item{display:flex;justify-content:space-between;align-items:center;padding:.45rem .6rem;border-radius:var(--sh-m);margin-bottom:.2rem;font-size:.8rem}
.h-item:nth-child(odd){background:var(--sc)}
.h-item .w{color:var(--win);font-weight:700}.h-item .l{color:var(--e);font-weight:700}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;background:color-mix(in srgb,var(--sc) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--ol-v);padding-bottom:env(safe-area-inset-bottom)}
.ni{flex:1;max-width:120px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0 .4rem;color:var(--on-sv);font-family:inherit}
.np{display:grid;place-items:center;width:56px;height:30px;border-radius:var(--sh-full);transition:background .2s}
.ni.on{color:var(--on)}.ni.on .np{background:var(--s2-c);color:var(--on-s2)}
.ni.on .mat{font-variation-settings:'FILL' 1}
.nl{font-size:.65rem;font-weight:500}

.sn{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;visibility:hidden;background:var(--on);color:var(--bg);border-radius:var(--sh-s);padding:.55rem 1rem;font-size:.85rem;transition:all .3s var(--ease);z-index:100;max-width:90vw;text-align:center}
.sn.on{transform:translate(-50%,0);opacity:1;visibility:visible}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left"><span class="topbar-name">Gapera</span><span class="topbar-beta">ALPHA</span></div>
  <div class="bal"><span class="mat">star</span><span id="bal"></span><span class="bonus" id="btxt"></span></div>
  <span class="uid" id="uid" title="Твой ID на сервере"></span>
</div>

<main>
  <!-- SLOTS -->
  <section class="scr on" id="s-slots">
    <div class="card">
      <div class="reels"><div class="reel" id="sr0">-</div><div class="reel" id="sr1">-</div><div class="reel" id="sr2">-</div></div>
      <div class="win-line" id="sW"></div>
      <div class="bet-row"><button class="btn btn-s btn-sm" id="sDn">−</button><input id="sBet" type="number" value="50" min="10" step="10" /><button class="btn btn-s btn-sm" id="sUp">+</button></div>
      <div class="bet-quick"><button class="bet-q" data-v="10">10</button><button class="bet-q" data-v="50">50</button><button class="bet-q" data-v="100">100</button><button class="bet-q" data-v="500">500</button></div>
      <button class="btn btn-p btn-lg" id="sGo" style="margin-top:.8rem"><span class="mat">casino</span> SPIN</button>
    </div>
    <div class="card"><div class="lbl">PAYTABLE</div><div class="pay-grid"><div>🍒🍒🍒 <b>×3</b></div><div>🍋🍋🍋 <b>×2</b></div><div>🔔🔔🔔 <b>×4</b></div><div>⭐⭐⭐ <b>×5</b></div><div>💎💎💎 <b>×10</b></div><div>7️⃣7️⃣7️⃣ <b>×20</b></div></div></div>
  </section>

  <!-- DICE -->
  <section class="scr" id="s-dice">
    <div class="card">
      <div class="dice-area"><div class="die" id="d0">1</div><div class="die" id="d1">1</div></div>
      <div class="dice-res" id="dR"></div>
      <div class="lbl">СТАВКА НА: <span id="dOU">БОЛЬШЕ</span></div>
      <div class="m3-slider" id="m3dSl">
        <input type="range" min="2" max="11" value="7" id="dSl" aria-label="Выбор значения" />
        <div class="m3-slider__label" id="dLabel">7</div>
        <div class="m3-slider__track">
          <div class="m3-slider__inactive"></div>
          <div class="m3-slider__active" id="dFill"></div>
          <div class="m3-slider__handle" id="dThumb"></div>
        </div>
      </div>
      <div class="dice-target"><span>2</span><span id="dT">7</span><span>11</span></div>
      <div class="dice-chance">
        <div class="ch-item"><div class="v" id="dCh">47%</div><div class="l">шанс</div></div>
        <div class="ch-item"><div class="v" id="dMl">×2.13</div><div class="l">множитель</div></div>
      </div>
      <div class="bet-row"><button class="btn btn-s btn-sm" id="dDn">−</button><input id="dBet" type="number" value="50" min="10" step="10" /><button class="btn btn-s btn-sm" id="dUp">+</button></div>
      <button class="btn btn-p btn-lg" id="dGo"><span class="mat">casino</span> БРОСИТЬ</button>
    </div>
  </section>

  <!-- ROULETTE -->
  <section class="scr" id="s-roulette">
    <div class="card">
      <div class="rr-num" id="rN">?</div>
      <div class="rr-res" id="rR"></div>
      <div class="rr-board">
        <div class="rr-row"><button class="rr-b rr-g" data-v="0">0</button></div>
        <div class="rr-row" id="rr1"></div>
        <div class="rr-row" id="rr2"></div>
        <div class="rr-row" id="rr3"></div>
        <div class="rr-out">
          <button class="rr-b" data-v="1to18" style="background:var(--sc-hi);color:var(--on)">1-18</button>
          <button class="rr-b" data-v="even" style="background:var(--sc-hi);color:var(--on)">Чёт</button>
          <button class="rr-b rr-r" data-v="red">🔴</button>
          <button class="rr-b rr-k" data-v="black">⚫</button>
          <button class="rr-b" data-v="odd" style="background:var(--sc-hi);color:var(--on)">Нечёт</button>
          <button class="rr-b" data-v="19to36" style="background:var(--sc-hi);color:var(--on)">19-36</button>
        </div>
      </div>
      <div class="bet-row"><button class="btn btn-s btn-sm" id="rDn">−</button><input id="rBet" type="number" value="50" min="10" step="10" /><button class="btn btn-s btn-sm" id="rUp">+</button></div>
      <button class="btn btn-p btn-lg" id="rGo"><span class="mat">casino</span> КРУТИТЬ</button>
    </div>
  </section>

  <!-- MINES -->
  <section class="scr" id="s-mines">
    <div class="card">
      <div class="m-row"><span class="lbl" style="margin:0">МИНЫ:</span><div class="m-cnt" id="mCnt"></div></div>
      <div class="m-grid" id="mGr"></div>
      <div class="m-info" id="mInf">Выбери клетки и выигрывай!</div>
      <div class="bet-row"><button class="btn btn-s btn-sm" id="mDn">−</button><input id="mBet" type="number" value="50" min="10" step="10" /><button class="btn btn-s btn-sm" id="mUp">+</button></div>
      <button class="btn btn-p btn-lg" id="mGo"><span class="mat">play_arrow</span> НАЧАТЬ</button>
      <button class="btn btn-w btn-lg" id="mCa" style="display:none"><span class="mat">savings</span> ЗАБРАТЬ <span id="mCaA"></span></button>
    </div>
  </section>

  <!-- COIN -->
  <section class="scr" id="s-coin">
    <div class="card" style="text-align:center">
      <div class="coin" id="cC">🪙</div>
      <div class="coin-res" id="cR"></div>
      <div class="coin-ch" id="cCh">
        <button data-v="h" class="on">Орёл 🦅</button>
        <button data-v="t">Решка 🔔</button>
      </div>
      <div class="bet-row"><button class="btn btn-s btn-sm" id="cDn">−</button><input id="cBet" type="number" value="50" min="10" step="10" /><button class="btn btn-s btn-sm" id="cUp">+</button></div>
      <button class="btn btn-p btn-lg" id="cGo"><span class="mat">casino</span> БРОСИТЬ</button>
    </div>
  </section>

  <!-- STATS -->
  <section class="scr" id="s-stats">
    <div class="card">
      <div class="lbl">СТАТИСТИКА</div>
      <div class="stat-row">
        <div class="stat"><div class="v" id="xT">0</div><div class="l">ставок</div></div>
        <div class="stat"><div class="v" id="xW">0</div><div class="l">побед</div></div>
        <div class="stat"><div class="v" id="xL">0</div><div class="l">проигрышей</div></div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="v" id="xWo">0</div><div class="l">выиграно</div></div>
        <div class="stat"><div class="v" id="xB">0</div><div class="l">поставлено</div></div>
        <div class="stat"><div class="v" id="xP">0</div><div class="l">профит</div></div>
      </div>
    </div>
    <div class="card"><div class="lbl">ИСТОРИЯ</div><div class="hist-list" id="hL"><div style="text-align:center;padding:.8rem;color:var(--on-sv);font-size:.8rem">Пусто</div></div></div>
    <button class="btn btn-o btn-lg" id="rst"><span class="mat">restart_alt</span> Сбросить</button>
  </section>
</main>

<nav class="nav">
  <button class="ni on" data-s="slots"><span class="np"><span class="mat">casino</span></span><span class="nl">Слоты</span></button>
  <button class="ni" data-s="dice"><span class="np"><span class="mat">sports_esports</span></span><span class="nl">Кости</span></button>
  <button class="ni" data-s="roulette"><span class="np"><span class="mat">circle</span></span><span class="nl">Рулетка</span></button>
  <button class="ni" data-s="mines"><span class="np"><span class="mat">explosion</span></span><span class="nl">Мины</span></button>
  <button class="ni" data-s="coin"><span class="np"><span class="mat">monetization_on</span></span><span class="nl">Монета</span></button>
  <button class="ni" data-s="stats"><span class="np"><span class="mat">bar_chart</span></span><span class="nl">Стата</span></button>
</nav>

<div class="sn" id="sn"></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const TG=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand()}catch(e){}}
const API='';

const EMOJI={cherry:'🍒',lemon:'🍋',bell:'🔔',star:'⭐',diamond:'💎',seven:'7️⃣'};
const SYM=['cherry','lemon','bell','star','diamond','seven'];
const PAY={cherry:3,lemon:2,bell:4,star:5,diamond:10,seven:20};
const RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const rNums=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];

let userId=0;
const initData=TG?TG.initData||'':'';
if(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user)userId=TG.initDataUnsafe.user.id;
if(!userId)userId=parseInt(localStorage.getItem('gUid'))||0;
if(!userId){userId=Math.floor(Math.random()*900000000)+100000000;localStorage.setItem('gUid',userId)}
$('uid').textContent='#'+userId;
const userName=(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user&&TG.initDataUnsafe.user.username)?TG.initDataUnsafe.user.username:(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user)?TG.initDataUnsafe.user.first_name||'':'';

let S={bal:1000,stats:{total:0,win:0,loss:0,won:0,bet:0},hist:[]};

async function api(path,body){
  try{
    const o={method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-User-Id':String(userId),'X-User-Name':userName,'X-Telegram-Init':initData}};
    if(body)o.body=JSON.stringify(body);
    const r=await fetch(API+path,o);
    return await r.json();
  }catch(e){return{error:e.message}}
}

async function loadUser(){
  const d=await api('/api/user');
  if(d.user){
    S.bal=d.user.balance;
    S.stats={total:d.user.total_bets,win:d.user.total_wins,loss:d.user.total_losses,won:d.user.total_wins>0?d.user.profit+d.user.total_bets:0,bet:d.user.total_bets};
    S.hist=(d.history||[]).map(h=>({g:h.game,r:h.won,a:h.bet,t:new Date(h.created_at).getTime()}));
    rBal();rSt();
  }
}

async function sendBet(game,bet,result,won){
  return await api('/api/bet',{game,bet,result,won});
}

let bT=60;
async function tryBonus(){
  const d=await api('/api/bonus');
  if(d.granted){S.bal=d.balance;sn('+500 монет!');rBal();bT=60;$('btxt').textContent='+500 через 60с'}
  else{
    if(d.balance!==undefined)S.bal=d.balance;
    bT=Math.max(1,(d.nextIn||60));
    $('btxt').textContent='+'+bT+'с';
  }
}
setInterval(async()=>{bT--;if(bT<=0){await tryBonus()}else $('btxt').textContent='+'+bT+'с'},1000);
async function init(){await tryBonus();await loadUser()}init();

function rBal(){$('bal').textContent=S.bal.toLocaleString()}
function sn(m){$('sn').textContent=m;$('sn').classList.add('on');setTimeout(()=>$('sn').classList.remove('on'),2000)}
function bz(k){if(TG&&TG.HapticFeedback)try{TG.HapticFeedback.notificationOccurred(k)}catch(e){}}
function aH(g,r,a){S.stats.total++;S.stats.bet+=a;if(r>0){S.stats.win++;S.stats.won+=r}else S.stats.loss++;S.hist.unshift({g,r,a,t:Date.now()});if(S.hist.length>50)S.hist.pop();rSt()}
function ok(v){return S.bal>=v}

// Nav
document.querySelectorAll('.ni').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.ni').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));$('s-'+b.dataset.s).classList.add('on');window.scrollTo({top:0});if(b.dataset.s==='stats')rSt()}));

// Bet helpers
function sBet(inp,dn,up){$(dn).addEventListener('click',()=>{const v=$(inp);v.value=Math.max(10,parseInt(v.value)-10)});$(up).addEventListener('click',()=>{const v=$(inp);v.value=parseInt(v.value)+10});const sec=$(inp).closest('section');if(sec)sec.querySelectorAll('.bet-q').forEach(b=>b.addEventListener('click',()=>{$(inp).value=b.dataset.v}))}
sBet('sBet','sDn','sUp');sBet('dBet','dDn','dUp');sBet('rBet','rDn','rUp');sBet('mBet','mDn','mUp');sBet('cBet','cDn','cUp');

// ===== SLOTS =====
const WS={seven:1,diamond:2,star:4,bell:8,lemon:16,cherry:40};
const TP={seven:120,diamond:30,star:12,bell:6,lemon:2.5,cherry:1.2};
const PP=1.2;
const WT=Object.values(WS).reduce((a,b)=>a+b,0);
function slotSpin(){
  const ev=[];const wg=[];
  for(const s of SYM){ev.push(['t',s]);wg.push(Math.pow(WS[s],3))}
  const tS=wg.slice(0,6).reduce((a,b)=>a+b,0);
  for(const s of SYM){ev.push(['p',s]);wg.push(3*WS[s]*WS[s]*(WT-WS[s]))}
  const pS=wg.slice(6).reduce((a,b)=>a+b,0);
  ev.push(['z',null]);wg.push(Math.pow(WT,3)-tS-pS);
  let r=Math.random()*Math.pow(WT,3);let k=ev.length-1;
  for(let i=0;i<wg.length;i++){r-=wg[i];if(r<=0){k=i;break}}
  const [t,s]=ev[k];let reels,pay;
  if(t==='t'){reels=[s,s,s];pay=TP[s]}
  else if(t==='p'){let o=s;while(o===s)o=SYM[Math.random()*6|0];const pos=[0,1,2].sort(()=>Math.random()-.5);reels=[null,null,null];reels[pos[0]]=s;reels[pos[1]]=s;reels[pos[2]]=o;pay=PP}
  else{reels=[SYM[Math.random()*6|0],SYM[Math.random()*6|0],SYM[Math.random()*6|0]];pay=0}
  return{reels,pay};
}
let sLock=false;
$('sGo').addEventListener('click',async()=>{
  if(sLock)return;const bet=parseInt($('sBet').value)||50;if(!ok(bet)){sn('Не хватает');return}
  sLock=true;$('sGo').disabled=true;$('sW').textContent='';
  document.querySelectorAll('.reel').forEach(r=>{r.classList.remove('win');r.classList.add('roll');r.textContent='-'});
  S.bal-=bet;rBal();
  const spin=slotSpin();const res=spin.reels;
  const els=[$('sr0'),$('sr1'),$('sr2')];
  const ivs=els.map(r=>setInterval(()=>{r.textContent=EMOJI[SYM[Math.random()*6|0]]},80));
  res.forEach((s,i)=>setTimeout(()=>{clearInterval(ivs[i]);els[i].textContent=EMOJI[s];els[i].classList.remove('roll')},600+i*350));
  setTimeout(async()=>{
    const w=Math.round(spin.pay*bet);
    S.bal+=w;rBal();
    if(w>0){els.forEach(r=>r.classList.add('win'));$('sW').textContent='ВЫИГРЫШ +'+w;$('sW').style.color='var(--win)';bz('success')}
    else{$('sW').textContent='Мимо';$('sW').style.color='var(--e)';bz('error')}
    aH('slots',w,bet);await sendBet('slots',bet,w,w);sLock=false;$('sGo').disabled=false;
  },600+2*350+300);
});

// ===== DICE =====
let dLock=false;
function slUpd(){const el=$('dSl');const p=((el.value-el.min)/(el.max-el.min))*100;const f=$('dFill');f.style.width='calc('+p+'% - 3px)';f.style.borderRadius=p>97?'8px':'8px 2px 2px 8px';$('dThumb').style.left=p+'%';$('dLabel').style.left=p+'%';$('dLabel').textContent=el.value}
function uDC(){const t=parseInt($('dSl').value);const mo=[0,0,35,33,30,26,21,15,10,6,3,1,0];const ch=mo[t]/36;const ml=(1/ch*.97).toFixed(2);$('dT').textContent=t;$('dCh').textContent=Math.round(ch*100)+'%';$('dMl').textContent='×'+ml;slUpd()}
$('dSl').addEventListener('input',uDC);uDC();
$('dGo').addEventListener('click',async()=>{
  if(dLock)return;const bet=parseInt($('dBet').value)||50;if(!ok(bet)){sn('Не хватает');return}
  dLock=true;$('dGo').disabled=true;$('dR').textContent='';S.bal-=bet;rBal();
  const t=parseInt($('dSl').value);const a=Math.random()*6|0;const b=Math.random()*6|0;const tot=a+b+2;
  $('d0').textContent=a+1;$('d1').textContent=b+1;
  const mo=[0,0,35,33,30,26,21,15,10,6,3,1,0];const isOv=tot>t;const ch=mo[t]/36;const ml=1/ch*.97;
  const w=isOv?Math.floor(bet*ml):0;
  setTimeout(async()=>{S.bal+=w;rBal();$('dR').innerHTML=tot+(w>0?' ✅ +'+w:' ❌ −'+bet);$('dR').style.color=w>0?'var(--win)':'var(--e)';aH('dice',w,bet);await sendBet('dice',bet,tot,w);dLock=false;$('dGo').disabled=false;bz(w?'success':'error')},500);
});

// ===== ROULETTE =====
(function(){[rr1,rr2,rr3].forEach((row,ri)=>{for(let i=ri*12;i<ri*12+12&&i<rNums.length;i++){const n=rNums[i];if(n===0)continue;const b=document.createElement('button');b.className='rr-b '+(RED.has(n)?'rr-r':'rr-k');b.dataset.v=n;b.textContent=n;$(row.id).appendChild(b)}})})();
let rLock=false,rSel=null;
document.querySelectorAll('.rr-b').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.rr-b').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');rSel=b.dataset.v}));
$('rGo').addEventListener('click',async()=>{
  if(rLock)return;if(!rSel){sn('Выбери ставку');return}const bet=parseInt($('rBet').value)||50;if(!ok(bet)){sn('Не хватает');return}
  rLock=true;$('rGo').disabled=true;$('rR').textContent='';S.bal-=bet;rBal();
  const wn=rNums[Math.random()*rNums.length|0];const iR=RED.has(wn);const c=iR?'#E53935':wn===0?'#2E7D32':'#212121';
  $('rN').textContent=wn;$('rN').style.background=c;$('rN').style.color='#fff';
  let w=0;
  if(rSel==='red'&&iR)w=bet*2;else if(rSel==='black'&&!iR&&wn!==0)w=bet*2;
  else if(rSel==='even'&&wn!==0&&wn%2===0)w=bet*2;else if(rSel==='odd'&&wn%2===1)w=bet*2;
  else if(rSel==='1to18'&&wn>=1&&wn<=18)w=bet*2;else if(rSel==='19to36'&&wn>=19&&wn<=36)w=bet*2;
  else if(String(wn)===String(rSel))w=bet*36;
  setTimeout(async()=>{S.bal+=w;rBal();$('rR').innerHTML=(w>0?'✅ '+wn+' — +'+w:'❌ '+wn+' — −'+bet);$('rR').style.color=w>0?'var(--win)':'var(--e)';aH('roulette',w,bet);await sendBet('roulette',bet,wn,w);rLock=false;$('rGo').disabled=false;bz(w?'success':'error')},800);
});

// ===== MINES =====
let mOn=false,mB=[],mR=[],mBt=0,mM=1;const mT=25;
(function(){const el=$('mCnt');for(let i=1;i<=10;i++){const b=document.createElement('button');b.textContent=i;b.addEventListener('click',()=>{el.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});if(i===3)b.classList.add('on');el.appendChild(b)}})();
function mGr(){const g=$('mGr');g.innerHTML='';for(let i=0;i<mT;i++){const c=document.createElement('div');c.className='m-cell';c.dataset.i=i;c.addEventListener('click',()=>mCl(i));g.appendChild(c)}}
mGr();
function mCl(i){
  if(!mOn||mR.includes(i))return;
  if(mB.includes(i)){mOn=false;document.querySelectorAll('.m-cell').forEach((c,x)=>{c.classList.add('rev');c.textContent=mB.includes(x)?'💣':'💎';if(mB.includes(x))c.classList.add('bomb');else c.classList.add('gem')});$('mInf').innerHTML='💥 Мина! −'+mBt;$('mInf').style.color='var(--e)';$('mGo').style.display='';$('mCa').style.display='none';aH('mines',0,mBt);sendBet('mines',mBt,0,0);bz('error');return}
  mR.push(i);const c=document.querySelectorAll('.m-cell')[i];c.classList.add('rev','gem');c.textContent='💎';
  const sf=mT-mB.length;mM=1;for(let j=1;j<=mR.length;j++)mM*=(sf-j+1)/(mT-j+1);mM=(1/mM*.97).toFixed(2);
  const co=Math.floor(mBt*mM);$('mInf').innerHTML='Множитель: <span class="mult">×'+mM+'</span> | Забрать: <b>'+co+'</b>';$('mInf').style.color='var(--on)';$('mCaA').textContent=co;
}
$('mGo').addEventListener('click',async()=>{
  const bet=parseInt($('mBet').value)||50;if(!ok(bet)){sn('Не хватает');return}
  const mc=parseInt(document.querySelector('.m-cnt .on')?.textContent||'3');S.bal-=bet;rBal();
  mBt=bet;mOn=true;mR=[];mM=1;mB=[];while(mB.length<mc){const i=Math.random()*mT|0;if(!mB.includes(i))mB.push(i)}
  mGr();$('mInf').innerHTML='Открывай клетки! Мины: '+mc;$('mInf').style.color='var(--on)';$('mGo').style.display='none';$('mCa').style.display='';
});
$('mCa').addEventListener('click',async()=>{
  if(!mOn)return;const co=Math.floor(mBt*mM);S.bal+=co;rBal();mOn=false;
  document.querySelectorAll('.m-cell').forEach((c,x)=>{c.classList.add('rev');if(mB.includes(x)){c.classList.add('bomb');c.textContent='💣'}});
  $('mInf').innerHTML='✅ Забрал <b>'+co+'</b> (×'+mM+')';$('mInf').style.color='var(--win)';$('mGo').style.display='';$('mCa').style.display='none';aH('mines',co,mBt);await sendBet('mines',mBt,co,co);bz('success');
});

// ===== COIN =====
let cCh='h',cFlip=false;
document.querySelectorAll('#cCh button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#cCh button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cCh=b.dataset.v}));
$('cGo').addEventListener('click',async()=>{
  if(cFlip)return;const bet=parseInt($('cBet').value)||50;if(!ok(bet)){sn('Не хватает');return}
  cFlip=true;$('cGo').disabled=true;$('cR').textContent='';S.bal-=bet;rBal();
  const r=Math.random()<.5?'h':'t';const c=$('cC');c.classList.add('flip');
  setTimeout(async()=>{c.classList.remove('flip');const rn=r==='h'?'🦅':'🔔';c.textContent=rn;const w=r===cCh?bet:0;const rl=cCh==='h'?'Орёл':'Решка';S.bal+=w;rBal();$('cR').innerHTML=(w>0?'✅ '+rl+' — +'+w:'❌ '+rl+' — −'+bet);$('cR').style.color=w>0?'var(--win)':'var(--e)';aH('coin',w,bet);await sendBet('coin',bet,0,w);cFlip=false;$('cGo').disabled=false;bz(w?'success':'error')},650);
});

// ===== STATS =====
function rSt(){$('xT').textContent=S.stats.total;$('xW').textContent=S.stats.win;$('xL').textContent=S.stats.loss;$('xWo').textContent=S.stats.won;$('xB').textContent=S.stats.bet;$('xP').textContent=S.stats.won-S.stats.bet;$('xP').style.color=S.stats.won-S.stats.bet>=0?'var(--win)':'var(--e)';const el=$('hL');if(!S.hist.length){el.innerHTML='<div style="text-align:center;padding:.8rem;color:var(--on-sv);font-size:.8rem">Пусто</div>';return}el.innerHTML='';S.hist.slice(0,30).forEach(h=>{const d=document.createElement('div');d.className='h-item';const t=new Date(h.t);const ts=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');d.innerHTML='<span>'+h.g+' • '+ts+'</span><span>'+(h.r>0?'<span class="w">+'+h.r+'</span>':'<span class="l">−'+h.a+'</span>')+'</span>';el.appendChild(d)})}
rSt();

$('rst').addEventListener('click',()=>{S={bal:1000,stats:{total:0,win:0,loss:0,won:0,bet:0},hist:[]};rBal();rSt();sLock=false;$('sGo').disabled=false;dLock=false;$('dGo').disabled=false;rLock=false;$('rGo').disabled=false;rSel=null;document.querySelectorAll('.rr-b').forEach(x=>x.classList.remove('sel'));mOn=false;$('mGo').style.display='';$('mCa').style.display='none';$('mInf').textContent='Выбери клетки и выигрывай!';$('mInf').style.color='';mGr();cFlip=false;$('cGo').disabled=false;$('cC').textContent='🪙';$('cR').textContent='';sn('Сброшено')});
})();
</script>
</body>
</html>
